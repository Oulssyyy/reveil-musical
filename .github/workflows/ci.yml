name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi : détecte les dépendances devenues obsolètes ou vulnérables

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (avertissements = erreurs, audit NuGet actif)
        run: dotnet build ReveilMusical.slnx -c Release
      - name: Tests + couverture (seuil 90 % lignes)
        run: >
          dotnet test --solution ReveilMusical.slnx -c Release --no-build
          --coverlet --coverlet-output-format cobertura
          --coverlet-threshold 90 --coverlet-threshold-type line

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ReveilMusical.slnx
      - name: Licences et fraîcheur
        run: python3 scripts/check_dependencies.py
      - name: Vulnérabilités connues
        run: |
          dotnet list ReveilMusical.slnx package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q ">" vuln.txt
      - name: Versions obsolètes (informatif)
        run: dotnet list ReveilMusical.slnx package --outdated
